__include__:
  - ./deimv2_dinov3_sp_obb.yml

# ============================================================================
# DEIMv2 DINOv3 ViT-S/16 STA — OBB preset variant, plain ViT-S/16 backbone.
# ----------------------------------------------------------------------------
# Same architecture as deimv2_dinov3_sp_obb.yml (conv_inplane 64 /
# hidden_dim 256; the adapter projects embed_dim→hidden_dim automatically,
# and vits16 shares vits16plus' 384-dim embedding, so no dims change). Only
# the backbone swaps: dinov3_vits16plus → dinov3_vits16 with its LVD-1689M
# pretraining weights. finetune stays False (frozen backbone).
# ============================================================================

DINOv3STAsResAtten:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  finetune: False
