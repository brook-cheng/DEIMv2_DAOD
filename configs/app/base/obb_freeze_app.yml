__include__:
  - ../presets/deimv2_dinov3_vits16_freeze_obb.yml

# ============================================================================
# OBB (DOTA / YOLO-OBB) application base — FROZEN plain ViT-S/16 variant.
# ----------------------------------------------------------------------------
# Identical public-section defaults to obb_app.yml; only the preset differs
# (DINOv3STAsResAtten: dinov3_vits16 backbone, finetune=False). Approved as
# an application base so user YAMLs can select it via __include__ while the
# trust boundary stays repo-curated.
# ============================================================================

project:
  name: deimv2-obb
  output_dir: ./outputs/deimv2-obb

runtime:
  input_size: [640, 640]
  seed: 42

data:
  format: DOTA
  train_images: null
  train_annotations: null
  val_images: null
  val_annotations: null
  classes_file: null
  num_workers: 2
  cache_images: none

train:
  epochs: 200
  batch_size: 4
  learning_rate: 5.0e-4
  device: cuda
  amp: True
  early_stopping:
    enabled: False
    patience: 40

evaluation:
  batch_size: 2
  device: cuda

inference:
  checkpoint: null
  device: cuda
  batch_size: 1
  score_threshold: 0.25
  top_k: 300
  output_formats:
    - json
    - visualization
