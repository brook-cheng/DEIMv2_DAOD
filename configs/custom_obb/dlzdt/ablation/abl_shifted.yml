# ============================================================================
# 消融实验: decoder_angle_encoding = "shifted"
# ============================================================================
# 基线: sp_fz_common.yml (decoder_angle_encoding="proportional")
# 变量: DEIMTransformer.decoder_angle_encoding "proportional" → "shifted"
#
# decoder_angle_encoding 语义（deim_decoder.py + obb_angle_contract.py）:
#   decoder 内部使用 sigmoid 参数化的归一化角度 θ_internal ∈ [0,1)
#   "proportional" → θ_internal = θ_phys/π
#     缺点: 0°/180° 落在 sigmoid 边界 (θ_internal→0/1)，梯度趋零，预测双峰
#   "shifted" → θ_internal = remainder(θ_phys/π + 0.25, 1)
#     优势: 0°→0.25, 90°→0.75，sigmoid 中心 0.5→45°；seam 移至 135°（远离常见方向）
#     公开契约 θ_phys ∈ [0,π) 不变（decoder 输出边界转换后还原）
#
# 影响范围: anchor 初始化(r=0.5)、denoising GT 编码、geometry decode、注意力旋转、
#           encoder 辅助输出、公开输出（共 7 个转换站点，均由构造期 resolve 守卫）
# rep2 不受影响（强制 proportional）
# checkpoint 不兼容: shifted 模式不可加载 proportional 的 checkpoint（编码语义不同）
# 观察重点: sigmoid 中心化是否改善角度梯度流 → 更快收敛 + 更均匀的角度分布
# ============================================================================
__include__: ['../sp_fz_common.yml']
output_dir: ./outputs/deimv2_obb_dlzdt_sp_fz_ablation/abl_shifted
DEIMTransformer:
  decoder_angle_encoding: "shifted"
