# ============================================================================
# 消融实验: angle_rep=2 + use_gate_fusion=true
# ============================================================================
# 基线: abl_rep2.yml (angle_rep=2, use_gate_fusion=false)
# 变量: DEIMTransformer.use_gate_fusion false → true
#
# use_gate_fusion 语义（deim_decoder.py TransformerDecoder + gated_fusion.py）:
#   仅对 rep2/3 有效（rep0/1 无 decouple_angle 分支）
#   false → box 特征流与 angle 特征流独立处理，仅通过 concat 合并
#   true  → 在 box/angle 分支间启用 GatedSoftmaxFusion
#     每层 decoder 的 box 特征 (output) 与 angle 特征 (dec_angle_output) 经
#     门控权重融合: fused = gate1*box + gate2*angle（gate 由 [box,angle] concat 后线性+sigmoid）
#     目的: 让角度预测能利用 box 空间信息，反之亦然
#
# 本实验在 rep2 基线上开启门控融合，对照 abl_rep2 评估融合增益
# 观察重点: GatedSoftmaxFusion 是否提升 rep2 的角度预测质量
# ============================================================================
__include__: ['../sp_fz_common.yml']
output_dir: ./outputs/deimv2_obb_dlzdt_sp_fz_ablation/abl_rep2_fused
DEIMTransformer:
  angle_rep: 2
  use_gate_fusion: true
