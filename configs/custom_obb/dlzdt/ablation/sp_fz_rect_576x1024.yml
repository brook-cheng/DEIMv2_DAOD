# 固定 576x1024 非等比缩放实验；不是 DETR 动态短边方案。

__include__: [
  '../sp_fz_common.yml'
]

output_dir: ./outputs/deimv2_obb_dlzdt_sp_fz_ablation/rect_576x1024
eval_spatial_size: [576, 1024]

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 0.0, fill_value: 0, use_cache: True, max_cached_images: 60, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: OBBZoomOut, fill: 0}
        - {type: OBBIoUCrop, p: 0.8}
        - {type: OBBSanitize, min_size: 1}
        - {type: OBBFlip}
        - {type: OBBResize, size: [576, 1024]}
        - {type: OBBSanitize, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: OBBConvertBoxes, normalize: True, img_size: [1024, 576]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      mosaic_prob: 0.0
  collate_fn:
    # 必须关闭，否则 collate 会将矩形输入重新缩放为方形。
    base_size_repeat: null

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: OBBResize, size: [576, 1024]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: OBBConvertBoxes, normalize: True, img_size: [1024, 576]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
