# ============================================================================
# 消融实验: angle_step = 0.1（多角度锚点）
# ============================================================================
# 基线: sp_fz_common.yml (angle_step=0.0)
# 变量: DEIMTransformer.angle_step 0.0 → 0.1
#
# angle_step 语义（deim_decoder.py DEIMTransformer._generate_anchors）:
#   0.0 → 每个空间位置 1 个默认角度锚点（θ_norm=0.25 即 45°）
#   0.1 → 每位置生成 1/0.1=10 个等间距角度候选锚点
#          候选 θ_norm = arange(10) * 0.1 = {0.0, 0.1, ..., 0.9}
#          encoder top-k 从 10x 候选池中选择最优角度的 query
#   多角度锚点增加初始角度多样性，缓解单角度锚点对极端倾斜目标初始化偏差
#
# 仅对 rep0/1/3 有效（rep2 anchor 为 6D 外接矩形偏移，无 θ 通道）
# 注意: num_queries=300 在多角度模式下从 10x 候选池中选择（memory 也按 n_angles 重复）
# 观察重点: 多角度锚点是否能加速收敛 + 提升极端角度目标检测
# ============================================================================
__include__: ['../sp_fz_common.yml']
output_dir: ./outputs/deimv2_obb_dlzdt_sp_fz_ablation/abl_mangle
DEIMTransformer:
  angle_step: 0.1
