# ============================================================================
# 消融实验: angle_rep = 1
# ============================================================================
# 基线: sp_fz_common.yml (angle_rep=0)
# 变量: DEIMTransformer.angle_rep 0 → 1
#
# angle_rep=1 语义（deim_decoder.py DEIMTransformer.__init__）:
#   box 表示: (cx,cy,w,h,θ_norm)，θ_norm ∈ [0,1) 为 sigmoid 参数化的归一化角度
#   refinement: 5D (α,β,γ,δ,Δθ)，角度通道直接回归有符号残差 Δθ（弧度）
#   与 rep0 的区别: rep0 为 6D (α,β,γ,δ,ε,η) 通过 vertex offset 间接回归角度；
#                  rep1 为 5D 直接回归 Δθ，参数更少但角度回归路径不同
#
# 派生参数: obbox_rep_dim 6 → 5（与 num_reg_dist 对齐）
# 观察重点: 直接角度残差回归 vs vertex offset 间接回归的收敛速度和精度差异
# ============================================================================
__include__: ['../sp_fz_common.yml']
output_dir: ./outputs/deimv2_obb_dlzdt_sp_fz_ablation/abl_rep1
DEIMTransformer:
  angle_rep: 1
DEIMCriterion:
  obbox_rep_dim: 5
