# ADR + KLD 消融实验
# 对照基线：sp_fz_rep0_nloss.yml。
# 实验目的：将原始 OBB 参数回归替换为 ADR 分解回归，同时保留 KLD 几何约束。
# 除 ADR loss 及对应输出目录外，训练设置和 Hungarian matcher 均与基线保持一致。
__include__: [
  '../../runtime.yml',
  '../../base/dataloader.yml',
  '../../base/optimizer.yml',
  '../../dataset/dota_detection.yml',
  '../dataset_common.yml',
  '../deimv2_obb_common.yml'
]

#### 项目配置
output_dir: ./outputs/deimv2_obb_dlzdt_sp_fz_rep0_nloss_adr
comet_project_name: 'deimv2_obb_sp_dlzdt'
eval_spatial_size: [640, 640] #  h w
checkpoint_freq: 10    # save freq
num_classes: 1

## DEIM LR-Scheduler
epoches: 300 #  Total epochs: 20 for training + EMA  for 4n = 12. n=3 refers to the model size in the matched config.
warmup_iter: 30   # 0.1 * epoches
flat_epoch: 150    # epoch // 2 + warmup_iter
no_aug_epoch: 60

#### 设置训练数据
## Dense O2O: Mosaic + Mixup + CopyBlend
train_dataloader:
  total_batch_size: 4 # total batch size equals to gpu_nums*batch_size
  num_workers: 2
  dataset:
    img_folder: /data/lyj_dir/yolo_train/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/images/train
    ann_folder: /data/lyj_dir/yolo_train/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/labels/train
    classes_file: /data/lyj_dir/yolo_train/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/classes.txt
    format: 'YOLO-OBB'
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 60, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: OBBZoomOut, fill: 0}
        - {type: OBBIoUCrop, p: 0.8}
        - {type: OBBSanitize, min_size: 1}
        - {type: OBBFlip}
        - {type: OBBResize, size: [640, 640]}
        - {type: OBBSanitize, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: OBBConvertBoxes, normalize: True, img_size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy:
        epoch: [30, 60, 150] # stop_epoch, 2阶段数据增强：0-无-> A(0.05~0.1)*epoch -强-> B(0.2~0.45)*epoch -弱-> C(0.3 *0.7)*epoch ->无
        ops: ['Mosaic', 'RandomPhotometricDistort', 'OBBZoomOut', 'OBBIoUCrop']
      mosaic_prob: 0.5


  collate_fn:
    base_size: 640
    # Mixup options
    mixup_prob: 0.5
    mixup_epochs: [30, 60]
    stop_epoch: 150    # epoch in [72, ~) stop `multiscales`
    # CopyBlend options
    copyblend_prob: 0.5
    copyblend_epochs: [30, 150]
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]
    ema_restart_decay: 0.9999
    base_size_repeat: 4

val_dataloader:
  total_batch_size: 2 # total batch size equals to gpu_nums*batch_size
  num_workers: 2
  dataset:
    img_folder: /data/lyj_dir/yolo_train/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/images/val
    ann_folder: /data/lyj_dir/yolo_train/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/labels/val
    classes_file: /data/lyj_dir/yolo_train/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/classes.txt
    format: 'YOLO-OBB'
    transforms:
      ops:
        - {type: OBBResize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: OBBConvertBoxes, normalize: True, img_size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}


#### 模型设置
### backbone
DINOv3STAsResAtten:
  name: dinov3_vits16plus # 名称参考 engine/backbone/dinov3/vision_transformer.py
  weights_path: ./ckpts/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
  interaction_indexes: []   # all layers will be used
  finetune: False
  conv_inplane: 64 # dinov3_hidden_dim/4
  hidden_dim: 256 # dinov3_hidden_dim*2/3
  adapter_type: 'sta'  # 'sta' or 'c3k2'

### encoder
HybridEncoder:
  in_channels: [256, 256, 256] #[hidden_dim,2*hidden_dim,4*hidden_dim]或[hidden_dim,hidden_dim,hidden_dim]
  hidden_dim: 256
  dim_feedforward: 1024 #4*hidden_dim

### decoder
DEIMTransformer:
  feat_channels: [256, 256, 256] #hidden_dim
  hidden_dim: 256 #hidden_dim
  dim_feedforward: 2048 # hidden_dim*8
  box_mode: obb
  angle_rep: 0

PostProcessor:
  box_mode: obb

### optimizer
optimizer:
  type: AdamW
  params:
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00001 # 模型参数量越大，值应该越小。比如：sp:1e-5, l:0.5e-5, b:2.5e-6, hp:1.25e-6
    -
      # including norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      # including norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005  # 模型参数量越大，值应该越小。比如：sp:5e-4, l:2.5e-4, b:1.25e-5, m:1.25e-5
  betas: [0.9, 0.999]
  weight_decay: 0.000125

### Loss
# ADR 将 5D OBB 回归拆分为轴对齐外接矩形回归和二维 offset 回归，
# 避免直接对角度参数计算独立的 angle loss。本实验额外保留 KLD 作为完整 OBB 几何约束。
DEIMCriterion:
  weight_dict: {
    loss_mal: 1,
    loss_extrect_l1: 5,   # 外接矩形 (cx, cy, w, h) 的 L1 回归损失
    loss_extrect_giou: 2, # 外接矩形的 GIoU 损失
    loss_offset_l1: 1,    # OBB 相对外接矩形的二维 offset L1 损失
    loss_kld: 2,          # 保留原始 5D OBB 的 KLD 几何约束，用于与无 KLD 组对照
    loss_fgl: 0.15,
    loss_ddf: 1.5
  }
  losses: ['mal', 'boxes', 'local']
  adr_loss: true           # 启用 ADR 分解回归路径
  use_yolo_probiou: false  # ADR 路径不计算旧的 Probiou loss
  use_yolo_angle: false    # ADR 路径不计算独立的 angle loss
  keep_kld: true           # 本组保留 KLD；与 adr_nokld 组的唯一 loss 消融差异
  angle_lambda: 0.0        # 关闭旧 angle loss 权重
  gamma: 1.0
  alpha: 0.75
  reg_max: 32
  box_mode: obb
  obbox_rep_dim: 6

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_probiou: 5, cost_angle: 3, cost_chamfer: 2, late_cost_bbox: 0.25}
    angle_order_alpha: 1.0
    alpha: 0.25
    gamma: 2.0
    # change matcher
    change_matcher: False
    iou_order_alpha: 4.0
    # 0.75~0.85 * epoches
    matcher_change_epoch: 112
    box_mode: obb
