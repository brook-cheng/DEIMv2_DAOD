# 多角度锚点实验（五提案 - 提案 2：多角度锚点）
# 对照基线：synthetic_exp_020_anrep0_offset_per.yml（rep0）。
# 实验目的：为每个空间位置生成多个角度候选锚点，增加初始角度多样性。
# 唯一变量：DEIMTransformer.angle_step = 0.1（0.1 步长 → 每位置 10 个角度候选）。
__include__: [../synthetic_exp_020_anrep0_offset_per.yml]

output_dir: ./outputs/syn_ablation_mangle

DEIMTransformer:
  angle_step: 0.1   # 多角度锚点步长：每位置 10 个角度候选（0 = 单角度）
